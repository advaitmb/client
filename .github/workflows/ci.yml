name: CI

on:
  push:
    branches: [selfhost]
  pull_request:
    branches: [selfhost]

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      # Pinned so the npm lockfile consistency check below isn't at the
      # mercy of whatever npm the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (bun is canonical, ADR-0004)
        run: bun install --frozen-lockfile

      # package-lock.json exists only for Claude Code cloud sessions, which
      # install with npm. It must never drift from package.json again
      # (ADR-0004 / CODE_REVIEW.md B6).
      - name: Check npm lockfile is in sync with package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json

      - name: Create config.js from config-example.js
        run: cp config-example.js config.js

      - name: Config check
        run: bun run config-check

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: elm-home/elm-stuff
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}

      # `bun test` and esbuild both strip types without checking them, so
      # nothing before this step reads a type annotation. src/ui/README.md
      # claimed this gate for months without it existing (CODE_REVIEW.md S11);
      # it catches what no test can, e.g. a field shadowing
      # `HTMLElement.prototype.title` (ticket 24).
      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Build
        run: bun run newbuild

      - name: Elm tests
        run: bun run test:elm

      - name: TypeScript/JS tests
        run: bun run test:ts
